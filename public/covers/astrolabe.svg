<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="40%" stop-color="#14141c"/>
      <stop offset="70%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae48f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6d1f"/>
    </linearGradient>
    <radialGradient id="astroglow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#fae48f" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1c2445" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#bg)"/>
  <circle cx="400" cy="500" r="420" fill="url(#astroglow)"/>

  <!-- Ornate Borders -->
  <rect x="40" y="40" width="720" height="1120" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="52" y="52" width="696" height="1096" fill="none" stroke="#d4af37" stroke-width="0.75" opacity="0.6"/>

  <!-- Corner Filigree -->
  <g stroke="url(#gold)" stroke-width="2" fill="none">
    <path d="M 40 100 L 100 100 L 100 40"/>
    <path d="M 760 100 L 700 100 L 700 40"/>
    <path d="M 40 1100 L 100 1100 L 100 1160"/>
    <path d="M 760 1100 L 700 1100 L 700 1160"/>
  </g>

  <!-- Complete Astrolabe Wheel Assembly -->
  <g stroke="url(#gold)" fill="none" stroke-width="1.5">
    <circle cx="400" cy="500" r="300" stroke-width="2.5"/>
    <circle cx="400" cy="500" r="280"/>
    <circle cx="400" cy="500" r="255" stroke-dasharray="2 4"/>
    <circle cx="400" cy="500" r="230"/>
    <circle cx="400" cy="500" r="190" stroke-dasharray="6 4"/>
    <circle cx="400" cy="500" r="150"/>
    <circle cx="400" cy="500" r="100" stroke-dasharray="3 3"/>
    <circle cx="400" cy="500" r="50"/>

    <!-- 12 Cardinal Rays & Crossbeams -->
    <line x1="100" y1="500" x2="700" y2="500"/>
    <line x1="400" y1="200" x2="400" y2="800"/>
    <line x1="188" y1="288" x2="612" y2="712"/>
    <line x1="188" y1="712" x2="612" y2="288"/>
    <line x1="140" y1="350" x2="660" y2="650" stroke-dasharray="4 6"/>
    <line x1="140" y1="650" x2="660" y2="350" stroke-dasharray="4 6"/>
  </g>

  <!-- Astrolabe Center Diamond Eye -->
  <polygon points="400,440 440,500 400,560 360,500" fill="#08080c" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="400" cy="500" r="18" fill="url(#gold)"/>

  <!-- Celestial Pointer Pointer Arm (Alidade) -->
  <line x1="220" y1="680" x2="580" y2="320" stroke="url(#gold)" stroke-width="3"/>
  <polygon points="580,320 570,345 595,335" fill="url(#gold)"/>
  <polygon points="220,680 230,655 205,665" fill="url(#gold)"/>

  <!-- Seal -->
  <circle cx="400" cy="980" r="42" fill="#0c0c14" stroke="url(#gold)" stroke-width="2"/>
  <polygon points="400,950 408,972 430,980 408,988 400,1010 392,988 370,980 392,972" fill="url(#gold)"/>
</svg>
